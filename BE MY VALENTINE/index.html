<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine, Robert!</title>
    <style>
        body {
            background: linear-gradient(135deg, #aee9f7 0%, #b6f7e7 100%);
            color: #6b6b9b;
            font-family: 'Quicksand', 'Montserrat', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #sakura-canvas, #cloud-canvas, #catbg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }
        .jumping-cat {
            position: fixed;
            width: 80px;
            height: 80px;
            z-index: 2;
            pointer-events: none;
            transition: transform 0.2s;
        }
        .game-box {
            background: rgba(255, 255, 255, 0.85);
            border: 4px solid #aee9f7;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 0 24px #aee9f7;
            text-align: center;
            max-width: 400px;
            z-index: 3;
        }
        .question {
            font-size: 1.2em;
            margin-bottom: 24px;
        }
        .btn {
            font-family: inherit;
            font-size: 1em;
            padding: 12px 32px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            background: #aee9f7;
            color: #6b6b9b;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #fff0f5;
        }
        .btn.no {
            background: #ffe0e3;
            color: #aee9f7;
            cursor: not-allowed;
            opacity: 0.5;
        }
        .message {
            margin-top: 24px;
            font-size: 1em;
            min-height: 40px;
            color: #ff6f91;
        }
        @media (max-width: 600px) {
            .game-box {
                padding: 16px 8px;
                max-width: 98vw;
            }
        }
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap');
    </style>
</head>
<body>
        <img src="cat_heart.gif" alt="Cat Heart" style="width:120px; display:block; margin:24px auto 0 auto; border-radius:16px; box-shadow:0 0 12px #aee9f7;">
    <canvas id="cloud-canvas" style="z-index:0;position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;"></canvas>
    <canvas id="sakura-canvas" style="z-index:2;position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;"></canvas>
    <canvas id="confetti-canvas" style="z-index:10;position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;"></canvas>
    <div class="game-box">
        <div class="question">Will you be my Valentine, Robert (Wawita)?</div>
        <button class="btn yes" onclick="showMessage()">YES</button>
        <button class="btn no" id="noBtn" onmouseover="moveNoButton()" ontouchstart="moveNoButton()">NO</button>
        <div class="message" id="message"></div>
    </div>
    <script>
                // --- Cloud Animation ---
                const cloudCanvas = document.getElementById('cloud-canvas');
                const cloudCtx = cloudCanvas.getContext('2d');
                function resizeCloudCanvas() {
                    cloudCanvas.width = window.innerWidth;
                    cloudCanvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resizeCloudCanvas);
                resizeCloudCanvas();
                let clouds = [];
                function randomCloud() {
                    return {
                        x: Math.random() * cloudCanvas.width,
                        y: Math.random() * cloudCanvas.height * 0.5,
                        w: 120 + Math.random() * 100,
                        h: 40 + Math.random() * 30,
                        speed: 0.2 + Math.random() * 0.3,
                        opacity: 0.18 + Math.random() * 0.12
                    };
                }
                for (let i = 0; i < 8; i++) clouds.push(randomCloud());
                function drawCloud(c) {
                    cloudCtx.save();
                    cloudCtx.globalAlpha = c.opacity;
                    // Draw a big heart as a cloud
                    cloudCtx.translate(c.x, c.y);
                    cloudCtx.scale(c.w / 100, c.h / 90);
                    cloudCtx.beginPath();
                    cloudCtx.moveTo(0, 0);
                    cloudCtx.bezierCurveTo(0, -30, -50, -30, -50, 0);
                    cloudCtx.bezierCurveTo(-50, 40, 0, 60, 0, 90);
                    cloudCtx.bezierCurveTo(0, 60, 50, 40, 50, 0);
                    cloudCtx.bezierCurveTo(50, -30, 0, -30, 0, 0);
                    cloudCtx.closePath();
                    cloudCtx.fillStyle = '#fff';
                    cloudCtx.shadowColor = '#fff';
                    cloudCtx.shadowBlur = 30;
                    cloudCtx.fill();
                    cloudCtx.setTransform(1,0,0,1,0,0);
                    cloudCtx.restore();
                }
                function animateClouds() {
                    cloudCtx.clearRect(0, 0, cloudCanvas.width, cloudCanvas.height);
                    for (let c of clouds) {
                        drawCloud(c);
                        c.x += c.speed;
                        if (c.x - c.w > cloudCanvas.width) {
                            c.x = -c.w;
                            c.y = Math.random() * cloudCanvas.height * 0.5;
                        }
                    }
                    requestAnimationFrame(animateClouds);
                }
                animateClouds();

                // ...existing code...

                // ...existing code...
        const messages = [
            "You are the best thing that happened to me!",
            "You are beautiful.",
            "I love being silly with you.",
            "I love your personality and intelligence.",
            "You make my heart smile!",
            "Every day with you is magical.",
            "You are my favorite adventure.",
            "I adore your smile.",
            "You are my Wawita forever.",
            "I love you more than anything!"
        ];
        let idx = 0;
        function showMessage() {
            document.getElementById('message').textContent = messages[idx];
            idx = (idx + 1) % messages.length;
            launchConfetti();
        }

        // Confetti de amor
        const confettiCanvas = document.getElementById('confetti-canvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        function resizeConfettiCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeConfettiCanvas);
        resizeConfettiCanvas();
        let confettiArr = [];
        function randomHeartConfetti() {
            const colors = ['#ff6f91','#ffb6b9','#fff0f5','#f67280','#c06c84','#6c5b7b','#355c7d'];
            return {
                x: Math.random() * confettiCanvas.width,
                y: -20,
                size: 18 + Math.random() * 16,
                speed: 2 + Math.random() * 2,
                drift: (Math.random() - 0.5) * 2,
                color: colors[Math.floor(Math.random()*colors.length)],
                angle: Math.random() * Math.PI * 2,
                spin: (Math.random() - 0.5) * 0.1
            };
        }
        function drawHeart(ctx, x, y, size, color, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(0, -size/2, -size, -size/2, -size, 0);
            ctx.bezierCurveTo(-size, size, 0, size*1.2, 0, size*1.7);
            ctx.bezierCurveTo(0, size*1.2, size, size, size, 0);
            ctx.bezierCurveTo(size, -size/2, 0, -size/2, 0, 0);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.restore();
        }
        function animateConfetti() {
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            for (let c of confettiArr) {
                drawHeart(confettiCtx, c.x, c.y, c.size, c.color, c.angle);
                c.x += c.drift;
                c.y += c.speed;
                c.angle += c.spin;
            }
            confettiArr = confettiArr.filter(c => c.y < confettiCanvas.height + 40);
            if (confettiArr.length > 0) requestAnimationFrame(animateConfetti);
        }
        function launchConfetti() {
            for (let i = 0; i < 32; i++) confettiArr.push(randomHeartConfetti());
            animateConfetti();
        }
    </script>

    <script>
        // NO button trick
        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            noBtn.style.position = 'absolute';
            noBtn.style.left = Math.random() * 60 + 20 + '%';
            noBtn.style.top = Math.random() * 60 + 20 + '%';
        }
        // Sakura petal animation
        const canvas = document.getElementById('sakura-canvas');
        const ctx = canvas.getContext('2d');
        let petals = [];
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        function randomPetal() {
            return {
                x: Math.random() * canvas.width,
                y: Math.random() * -canvas.height,
                r: 8 + Math.random() * 10,
                speed: 1 + Math.random() * 2,
                drift: (Math.random() - 0.5) * 1.5,
                angle: Math.random() * Math.PI * 2,
                spin: (Math.random() - 0.5) * 0.04
            };
        }
        function drawPetal(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-p.r/2, -p.r/2, -p.r, p.r/2, 0, p.r);
            ctx.bezierCurveTo(p.r, p.r/2, p.r/2, -p.r/2, 0, 0);
            ctx.fillStyle = 'rgba(255,182,193,0.7)';
            ctx.shadowColor = '#ffb6b9';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.restore();
        }
        function animatePetals() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let p of petals) {
                drawPetal(p);
                p.x += p.drift;
                p.y += p.speed;
                p.angle += p.spin;
            }
            petals = petals.filter(p => p.y < canvas.height + 40);
            while (petals.length < 30) petals.push(randomPetal());
            requestAnimationFrame(animatePetals);
        }
        animatePetals();
    </script>
